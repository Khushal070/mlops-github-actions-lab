name: Model Retraining on Push to Main - Github Lab 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: pip install -r Labs/Github_Labs/Lab2/requirements.txt

    - name: Generate Timestamp
      run: echo "timestamp=$(date '+%Y%m%d%H%M%S')" >> $GITHUB_ENV

    - name: Retrain Model
      run: python Labs/Github_Labs/Lab2/src/train_model.py --timestamp "$timestamp"

    - name: Evaluate Model and Quality Gate
      run: |
        python Labs/Github_Labs/Lab2/src/evaluate_model.py --timestamp "$timestamp"
        mkdir -p Labs/Github_Labs/Lab2/metrics
        mv "${timestamp}_metrics.json" "Labs/Github_Labs/Lab2/metrics/${timestamp}_metrics.json"

    - name: Store and Version the New Model
      run: |
        mkdir -p Labs/Github_Labs/Lab2/models
        mv "model_${timestamp}_dt_model.joblib" "Labs/Github_Labs/Lab2/models/"

    - name: Commit and Push Changes
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add -f Labs/Github_Labs/Lab2/metrics Labs/Github_Labs/Lab2/models
        if ! git diff --cached --quiet; then
          git commit -m "Add metrics and model for $timestamp"
          git push
        else
          echo "No changes to commit."
        fi